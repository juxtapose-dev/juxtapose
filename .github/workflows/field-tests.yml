name: field tests

# Runs jux against three large public Storybooks (built from pinned commits)
# and fails on capture errors, unexpected cross-pass differences, or a slow
# run. See docs/field-tests.md and scripts/field-tests.config.json.
#
# Nightly and on manual dispatch only: a full sweep takes about 30 minutes per
# Storybook, too long to gate every pull request that touches capture code.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      storybook:
        description: Which Storybook to test
        type: choice
        options: [all, chakra, primer, spectrum]
        default: all
      stories:
        description: 'Story ids to capture, comma-separated (empty = all). Setting this skips the gate: it is an investigation run.'
        type: string
        default: ''
      text_probe:
        description: 'Collect paired screenshots and shadow-DOM/font evidence for selected stories (investigation only)'
        type: boolean
        default: false
      text_experiment:
        description: 'Text probe intervention (sweep runs all four sequentially)'
        type: choice
        options:
          [
            baseline,
            raw,
            paint,
            caret-paint,
            delay,
            warm-pixel,
            warm-full,
            sweep,
            warm-sweep,
          ]
        default: baseline
      renderer:
        description: Renderer policy (sweep compares shared, fresh, and cache pulse)
        type: choice
        options: [configured, shared, fresh, pulse, sweep]
        default: configured
      concurrency:
        description: Capture workers (sweep runs 1, 2, 3 sequentially on the same runner)
        type: choice
        options: [configured, '1', '2', '3', sweep]
        default: configured
      passes:
        description: Capture passes
        type: string
        default: '2'

# Third-party build scripts run in this workflow: read-only token, no secrets.
permissions:
  contents: read

concurrency:
  group: field-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix is built here so the `storybook` input can filter it; a job-level
  # `if` cannot read the matrix context.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PICK: ${{ inputs.storybook || 'all' }}
        run: |
          # `sha` is the commit docs/field-tests.md pins. `output` is where the
          # repo's own build leaves the static Storybook, relative to its root.
          all='[
            {"name":"chakra","repo":"chakra-ui/chakra-ui","sha":"fa9696f328ea5a0df8685c6d8460edbd779b63b9","node":"24","output":"storybook-static"},
            {"name":"primer","repo":"primer/react","sha":"7f5303d803986887187d86dcebaeda22a4dc6823","node":"24","output":"packages/react/storybook-static"},
            {"name":"spectrum","repo":"adobe/spectrum-web-components","sha":"9d8151f41f7cd363613aa4f3f1ae17739e69dd65","node":"24","output":"1st-gen/projects/documentation/dist/storybook"}
          ]'
          matrix=$(jq -c --arg p "$PICK" '{include: map(select($p == "all" or .name == $p))}' <<< "$all")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  field-test:
    name: field test (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      # The runner context is not available in job-level env.
      - name: Set paths
        run: |
          {
            echo "SB_CACHE=$RUNNER_TEMP/sb-cache"
            echo "SB_SRC=$RUNNER_TEMP/sb-src"
            echo "OUT_DIR=$RUNNER_TEMP/field-out"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Cache Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/jux
          key: chrome-headless-shell-151.0.7922.34-${{ runner.os }}

      - name: Install Chromium
        run: node packages/cli/dist/index.js browser install

      # deb.deps ships beside the binary in the Chrome for Testing zip.
      # Lines may carry version constraints and `a | b` alternatives, which
      # `apt-get satisfy` understands (comma-joined). If satisfy rejects a line
      # (a renamed package, a missing deb.deps), fall back to the README's
      # Ubuntu 24.04 list.
      - name: Install Chromium system libraries
        run: |
          dir=$(dirname "$(node packages/cli/dist/index.js browser path)")
          sudo apt-get update
          sudo apt-get satisfy -y --no-install-recommends "$(paste -sd, "$dir/deb.deps")" ||
            sudo apt-get install -y --no-install-recommends libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2

      # The static build only, keyed by the pinned commit.
      - name: Restore the static Storybook
        id: sb
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sb-cache
          key: ${{ matrix.name }}-${{ matrix.sha }}-${{ runner.os }}

      # Third-party code: cloned outside the jux checkout, at the exact pinned
      # commit, with no credentials in the environment or the git config.
      - name: Clone ${{ matrix.repo }} at the pinned commit
        if: steps.sb.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$SB_SRC"
          cd "$SB_SRC"
          git init -q .
          git remote add origin "https://github.com/${{ matrix.repo }}.git"
          git fetch --depth 1 origin "${{ matrix.sha }}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"

      # Build commands are the ones in docs/field-tests.md.
      - name: Build the static Storybook
        if: steps.sb.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/sb-src
        run: |
          case "${{ matrix.name }}" in
            chakra)
              # packageManager pins pnpm 11.10.0
              npx --yes pnpm@11.10.0 install --frozen-lockfile
              npx --yes pnpm@11.10.0 build:storybook
              ;;
            primer)
              npm ci
              cd packages/react
              DEPLOY_ENV=production npx storybook build --quiet --disable-telemetry --loglevel error
              ;;
            spectrum)
              # The repo ships its own Yarn release; corepack makes `yarn`
              # resolvable for the nested script calls, and yarnPath wins.
              corepack enable
              yarn install
              yarn build
              cd 1st-gen
              yarn storybook:build
              ;;
          esac
          cd "$SB_SRC"
          test -f "${{ matrix.output }}/index.html"
          mkdir -p "$SB_CACHE"
          cp -R "${{ matrix.output }}/." "$SB_CACHE/"

      # Saved right after the build, not at job end, so a failing gate does not
      # throw the build away.
      - name: Save the static Storybook
        if: steps.sb.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sb-cache
          key: ${{ matrix.name }}-${{ matrix.sha }}-${{ runner.os }}

      # Two passes over every story by default. A dispatch can set `passes` and
      # `stories`; with `stories` the script is an investigation run: it skips
      # the gate and only reports and copies images. Inputs go through env, not
      # into the script text.
      - name: Field test
        env:
          STORIES: ${{ inputs.stories }}
          PASSES: ${{ inputs.passes || '2' }}
          WORKERS: ${{ inputs.concurrency || 'configured' }}
          RENDERER: ${{ inputs.renderer || 'configured' }}
          TEXT_PROBE: ${{ inputs.text_probe || 'false' }}
          JUX_TEXT_WORKERS: ${{ inputs.concurrency == 'configured' && '1' || inputs.concurrency || '1' }}
          TEXT_EXPERIMENT: ${{ inputs.text_experiment || 'baseline' }}
        run: |
          mkdir -p "$OUT_DIR"
          case "$PASSES" in '' | *[!0-9]*) echo "passes must be a number" >&2; exit 2 ;; esac
          if [ "$TEXT_PROBE" = true ]; then
            case "$STORIES" in '') echo "text_probe requires story ids" >&2; exit 2 ;; esac
            IFS=, read -ra probe_stories <<< "$STORIES"
            for story in "${probe_stories[@]}"; do
              if [[ ! "$story" =~ ^[a-zA-Z0-9_-]+$ ]]; then echo "invalid probe story id" >&2; exit 2; fi
            done
            case "$RENDERER" in
              configured) RENDERER=fresh ;;
              fresh|shared|pulse) ;;
              *) echo "text_probe requires a single renderer mode" >&2; exit 2 ;;
            esac
            case "$TEXT_EXPERIMENT" in
              baseline|raw|paint|caret-paint|delay|warm-pixel|warm-full) experiments=("$TEXT_EXPERIMENT") ;;
              sweep) experiments=(baseline raw paint caret-paint) ;;
              warm-sweep) experiments=(baseline delay warm-pixel warm-full) ;;
              *) echo "invalid text experiment" >&2; exit 2 ;;
            esac
            for story in "${probe_stories[@]}"; do
            for experiment in "${experiments[@]}"; do
              JUX_TEXT_EXPERIMENT="$experiment" node scripts/probe-text-rendering.mjs "$SB_CACHE" "$story" "$PASSES" "$OUT_DIR/$story/$experiment" "$RENDERER"
            done
            done
            exit 0
          fi
          args=()
          if [ -n "$STORIES" ]; then args+=(--stories "$STORIES"); fi
          case "$WORKERS" in
            configured) workers=(configured) ;;
            1|2|3) workers=("$WORKERS") ;;
            sweep) workers=(1 2 3) ;;
            *) echo "invalid concurrency" >&2; exit 2 ;;
          esac
          case "$RENDERER" in
            configured|shared|fresh|pulse) renderers=("$RENDERER") ;;
            sweep) renderers=(shared fresh pulse) ;;
            *) echo "invalid renderer" >&2; exit 2 ;;
          esac
          for renderer in "${renderers[@]}"; do
          for worker in "${workers[@]}"; do
            dest="$OUT_DIR"
            renderer_args=()
            if [ "$renderer" != configured ]; then
              dest="$dest/renderer-$renderer"
              renderer_args=(--renderer "$renderer")
            fi
            capture_args=()
            if [ "$worker" != configured ]; then
              dest="$dest/workers-$worker"
              mkdir -p "$dest"
              capture_args=(--concurrency "$worker")
            fi
            mkdir -p "$dest"
            node scripts/field-test.mjs "$SB_CACHE" "$PASSES" --storybook "${{ matrix.name }}" \
              "${args[@]}" "${capture_args[@]}" "${renderer_args[@]}" --json "$dest/result.json" --report-dir "$dest"
          done
          done
          echo "cache-hit=${{ steps.sb.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

      # field-out holds result.json, the report.json files and images/ (the
      # captures of every story that differed or errored, per pass).
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: field-test-${{ matrix.name }}
          path: ${{ runner.temp }}/field-out
          if-no-files-found: ignore
          retention-days: 14
