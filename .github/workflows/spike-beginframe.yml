# SPIKE (#145): frame-controlled capture needs Linux (Chrome refuses
# enableBeginFrameControl on macOS), so the measurements run here, on this
# repo's own fixtures, corpus and examples. Only on this branch; delete with
# the spike.
name: spike-beginframe

on:
  push:
    branches: [spike/begin-frame]

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/jux
          key: chrome-headless-shell-151.0.7922.34-${{ runner.os }}
      - run: node packages/cli/dist/index.js browser install
      - name: Install Chromium system libraries
        run: |
          dir=$(dirname "$(node packages/cli/dist/index.js browser path)")
          sudo apt-get update
          sudo apt-get satisfy -y --no-install-recommends "$(paste -sd, "$dir/deb.deps")" ||
            sudo apt-get install -y --no-install-recommends libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
      - name: Build example workbenches
        run: |
          pnpm --filter example-storybook build
          pnpm --filter example-ladle build
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
      - name: Measure
        run: |
          mkdir -p out
          S=scripts/spike-beginframe.mjs
          BF="JUX_BEGIN_FRAME=1"
          BARE="JUX_SPIKE_PARTIAL_RASTER=1 JUX_SPIKE_NO_RERASTER=1"
          SPIKE_ARM=main node $S probe out/probe-main.json || true
          env SPIKE_ARM=bf $BF node $S probe out/probe-bf.json || true
          env SPIKE_ARM=bf0 $BF JUX_BEGIN_FRAME_INTERVAL_MS=0 node $S probe out/probe-bf0.json || true
          # #120 and #136 fixtures
          SPIKE_ARM=main node $S fixtures 5 out/fx-1-main.json || true
          env SPIKE_ARM=main-bare $BARE node $S fixtures 5 out/fx-2-mainbare.json || true
          env SPIKE_ARM=bf-bare $BF $BARE node $S fixtures 5 out/fx-3-bfbare.json || true
          env SPIKE_ARM=bf-no120flag $BF JUX_SPIKE_PARTIAL_RASTER=1 node $S fixtures 5 out/fx-4-bfnopr.json || true
          env SPIKE_ARM=bf-noreraster $BF JUX_SPIKE_NO_RERASTER=1 node $S fixtures 5 out/fx-5-bfnorr.json || true
          env SPIKE_ARM=bf $BF node $S fixtures 5 out/fx-6-bf.json || true
          # corpus, 10 calls per arm
          SPIKE_ARM=main node $S snap 10 out/snap-1-main.json || true
          env SPIKE_ARM=bf $BF node $S snap 10 out/snap-2-bf.json || true
          env SPIKE_ARM=bf-bare $BF $BARE node $S snap 10 out/snap-3-bfbare.json || true
          env SPIKE_ARM=bf0 $BF JUX_BEGIN_FRAME_INTERVAL_MS=0 node $S snap 10 out/snap-4-bf0.json || true
          # examples, 5 runs per arm
          for ex in storybook ladle; do
            SPIKE_ARM=main node $S run examples/$ex 5 out/ex-$ex-1-main.json || true
            env SPIKE_ARM=bf $BF node $S run examples/$ex 5 out/ex-$ex-2-bf.json || true
            env SPIKE_ARM=bf-bare $BF $BARE node $S run examples/$ex 5 out/ex-$ex-3-bfbare.json || true
            env SPIKE_ARM=bf0 $BF JUX_BEGIN_FRAME_INTERVAL_MS=0 node $S run examples/$ex 5 out/ex-$ex-4-bf0.json || true
          done
          node $S summary out/summary.md out/fx-*.json out/snap-*.json out/ex-*.json
          cat out/probe-*.json >> out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-measure
          path: out/
