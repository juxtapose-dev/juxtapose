name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm test

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    # The visual-report step below comments on the PR, which the default
    # read-only token cannot do.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @juxtapose/cli exec playwright install --with-deps chromium

      - name: Build example workbenches
        run: |
          pnpm --filter example-storybook build
          pnpm --filter example-storybook-vue build
          pnpm --filter example-ladle build
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

      # The invariant the whole design rests on: pass/fail is a byte-exact
      # hash, so a story that captures differently on identical input is a
      # permanently failing build. This is a race, and a race that shows up
      # one run in five will pass a single-shot check — hence repeated runs.
      #
      # Note this does NOT compare against committed baselines. Antialiasing
      # differs across machines and Chromium versions, so a baseline captured
      # on a developer's Mac would never match a CI runner. What must hold is
      # that repeated captures on the SAME machine agree.
      - name: Determinism (Storybook)
        run: node scripts/check-determinism.mjs examples/storybook 3

      # Vue is here to keep "works with Storybook" honest: the adapter is
      # renderer-agnostic, and this is what would catch it if that stopped
      # being true.
      - name: Determinism (Storybook, Vue)
        run: node scripts/check-determinism.mjs examples/storybook-vue 3

      - name: Determinism (Ladle)
        run: node scripts/check-determinism.mjs examples/ladle 3

      # Dogfooding. This is the only way to exercise the reporter's actual
      # POST/PATCH against GitHub — every other part of it is unit-tested, but
      # the network call needs a real PR. Running it here means every PR to
      # this repo is a live test of the feature.
      #
      # `|| true` because the examples deliberately ship without committed
      # baselines (antialiasing differs across machines), so this run always
      # reports stories as new. That is expected here and must not fail the
      # build — we care that the comment posts, not what it says.
      - name: Visual report (dogfood)
        if: github.event_name == 'pull_request'
        working-directory: examples/storybook
        run: node ../../packages/cli/dist/index.js run --all --comment || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
