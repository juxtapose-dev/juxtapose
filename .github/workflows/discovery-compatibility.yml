name: discovery compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/discovery-compatibility.yml'
      - 'scripts/check-discovery-selection.mjs'
      - 'packages/adapter-storybook/**'
      - 'packages/core/src/capture/discover*'
      - 'packages/core/src/platform.ts'
      - 'packages/cli/src/commands/run*'

permissions:
  contents: read

concurrency:
  group: discovery-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    name: Storybook ${{ matrix.storybook }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        storybook: ['9.1.21', '10.6.0']
    env:
      JUX_STATE_DIR: ${{ runner.temp }}/jux-discovery-state
      JUX_NO_DAEMON: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jux
          key: chrome-headless-shell-151.0.7922.34-${{ runner.os }}
      - run: node packages/cli/dist/index.js browser install
      - name: Install Chromium libraries
        shell: bash
        run: |
          dir=$(dirname "$(node packages/cli/dist/index.js browser path)")
          sudo apt-get update
          sudo apt-get satisfy -y --no-install-recommends "$(paste -sd, "$dir/deb.deps")" ||
            sudo apt-get install -y --no-install-recommends libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
      - name: Prepare pinned fixture
        run: node scripts/check-discovery-selection.mjs --prepare '${{ matrix.storybook }}' "$RUNNER_TEMP/fixture"
      # Isolated CI-only dependencies: never replace the repository workspace.
      - name: Install fixture dependencies
        working-directory: ${{ runner.temp }}/fixture
        run: npm install --no-audit --no-fund
      - name: Build fixture
        working-directory: ${{ runner.temp }}/fixture
        run: ./node_modules/.bin/storybook build --disable-telemetry -o static
      - name: Verify real discovery and --since
        run: node scripts/check-discovery-selection.mjs "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/evidence"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ matrix.storybook }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/fixture/package-lock.json
          retention-days: 14
          if-no-files-found: warn
