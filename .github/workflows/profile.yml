name: profile

# Dispatch-only. Profiles `jux run` over a fixed sample of a pinned Storybook on
# ubuntu-latest (4 vCPU): per-phase timings, jux's CPU profile, Chrome traces,
# the PNG-vs-WebP screenshot bench, and interleaved A/B variants with hash
# equality. Reuses field-tests.yml's cache keys, so a Storybook built there is
# not rebuilt here. Output: the job summary and the profile-<name> artifact.
on:
  workflow_dispatch:
    inputs:
      storybook:
        description: Which Storybook to profile
        type: choice
        options: [all, chakra, primer, spectrum]
        default: spectrum
      stories:
        description: Stories in the sample
        type: string
        default: '200'
      repeats:
        description: Repeats of each variant (interleaved)
        type: string
        default: '3'
      variants:
        description: Comma-separated run-profile.mjs variants
        type: string
        default: 'base,png-speed,chrome-webp,chrome-webp-noicc,sharp-conc1,uv-threads-8,v8-cache-none,js-no-opt,no-fresh-renderer,c2,c4'

# Third-party build scripts run in this workflow: read-only token, no secrets.
permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The matrix is built here so the `storybook` input can filter it; a job-level
  # `if` cannot read the matrix context.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PICK: ${{ inputs.storybook || 'all' }}
        run: |
          # `sha` is the commit docs/field-tests.md pins. `output` is where the
          # repo's own build leaves the static Storybook, relative to its root.
          all='[
            {"name":"chakra","repo":"chakra-ui/chakra-ui","sha":"fa9696f328ea5a0df8685c6d8460edbd779b63b9","node":"24","output":"storybook-static"},
            {"name":"primer","repo":"primer/react","sha":"7f5303d803986887187d86dcebaeda22a4dc6823","node":"24","output":"packages/react/storybook-static"},
            {"name":"spectrum","repo":"adobe/spectrum-web-components","sha":"9d8151f41f7cd363613aa4f3f1ae17739e69dd65","node":"24","output":"1st-gen/projects/documentation/dist/storybook"}
          ]'
          matrix=$(jq -c --arg p "$PICK" '{include: map(select($p == "all" or .name == $p))}' <<< "$all")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  field-test:
    name: profile (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
      STORIES: ${{ inputs.stories || '200' }}
      REPEATS: ${{ inputs.repeats || '3' }}
      VARIANTS: ${{ inputs.variants }}
    steps:
      # The runner context is not available in job-level env.
      - name: Set paths
        run: |
          {
            echo "SB_CACHE=$RUNNER_TEMP/sb-cache"
            echo "SB_SRC=$RUNNER_TEMP/sb-src"
            echo "OUT_DIR=$RUNNER_TEMP/field-out"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Cache Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/jux
          key: chrome-headless-shell-151.0.7922.34-${{ runner.os }}

      - name: Install Chromium
        run: node packages/cli/dist/index.js browser install

      # deb.deps ships beside the binary in the Chrome for Testing zip.
      # Lines may carry version constraints and `a | b` alternatives, which
      # `apt-get satisfy` understands (comma-joined). If satisfy rejects a line
      # (a renamed package, a missing deb.deps), fall back to the README's
      # Ubuntu 24.04 list.
      - name: Install Chromium system libraries
        run: |
          dir=$(dirname "$(node packages/cli/dist/index.js browser path)")
          sudo apt-get update
          sudo apt-get satisfy -y --no-install-recommends "$(paste -sd, "$dir/deb.deps")" ||
            sudo apt-get install -y --no-install-recommends libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2

      # The static build only, keyed by the pinned commit.
      - name: Restore the static Storybook
        id: sb
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sb-cache
          key: ${{ matrix.name }}-${{ matrix.sha }}-${{ runner.os }}

      # Third-party code: cloned outside the jux checkout, at the exact pinned
      # commit, with no credentials in the environment or the git config.
      - name: Clone ${{ matrix.repo }} at the pinned commit
        if: steps.sb.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$SB_SRC"
          cd "$SB_SRC"
          git init -q .
          git remote add origin "https://github.com/${{ matrix.repo }}.git"
          git fetch --depth 1 origin "${{ matrix.sha }}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"

      # Build commands are the ones in docs/field-tests.md.
      - name: Build the static Storybook
        if: steps.sb.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/sb-src
        run: |
          case "${{ matrix.name }}" in
            chakra)
              # packageManager pins pnpm 11.10.0
              npx --yes pnpm@11.10.0 install --frozen-lockfile
              npx --yes pnpm@11.10.0 build:storybook
              ;;
            primer)
              npm ci
              cd packages/react
              DEPLOY_ENV=production npx storybook build
              ;;
            spectrum)
              # The repo ships its own Yarn release; corepack makes `yarn`
              # resolvable for the nested script calls, and yarnPath wins.
              corepack enable
              yarn install
              yarn build
              cd 1st-gen
              yarn storybook:build
              ;;
          esac
          cd "$SB_SRC"
          test -f "${{ matrix.output }}/index.html"
          mkdir -p "$SB_CACHE"
          cp -R "${{ matrix.output }}/." "$SB_CACHE/"

      # Saved right after the build, not at job end, so a failing gate does not
      # throw the build away.
      - name: Save the static Storybook
        if: steps.sb.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sb-cache
          key: ${{ matrix.name }}-${{ matrix.sha }}-${{ runner.os }}

      - name: Host
        run: |
          {
            echo '### Host'
            echo '```text'
            nproc; uname -a; grep -m1 'model name' /proc/cpuinfo; free -m | head -2; uptime
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The reference build for hash equality: origin/main's own CLI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: main-ref
          persist-credentials: false
      - name: Build main
        working-directory: main-ref
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Screenshot bench (PNG vs Chrome WebP, 100 stories)
        run: |
          mkdir -p "$OUT_DIR"
          BENCH_REPEATS=20 node scripts/profile/shot-bench.mjs "$SB_CACHE" 100 --out "$OUT_DIR/shot-bench.json" | tee "$OUT_DIR/shot-bench.txt"
          { echo '### Screenshot bench'; echo '```text'; cat "$OUT_DIR/shot-bench.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Chrome trace (20 stories)
        run: |
          node scripts/profile/trace-chrome.mjs "$SB_CACHE" 20 --out "$OUT_DIR/trace.json" | tee "$OUT_DIR/trace.txt"
          { echo '### Chrome trace'; echo '```text'; cat "$OUT_DIR/trace.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: jux CPU profile (base, concurrency 3)
        run: |
          node scripts/profile/run-profile.mjs "$SB_CACHE" --out "$OUT_DIR/cpuprof" --stories "$STORIES" --concurrency 3 --cpu-prof --variants base
          node scripts/profile/analyze.mjs "$OUT_DIR/cpuprof" >> "$GITHUB_STEP_SUMMARY"

      - name: Hash equality against main
        run: |
          node scripts/profile/hash-compare.mjs "$SB_CACHE" "$GITHUB_WORKSPACE/main-ref/packages/cli/dist/index.js" "$STORIES" | tee "$OUT_DIR/hash-vs-main.txt"
          { echo '### Hashes vs main'; echo '```text'; cat "$OUT_DIR/hash-vs-main.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Variant matrix
        run: |
          node scripts/profile/run-profile.mjs "$SB_CACHE" --out "$OUT_DIR/matrix" --stories "$STORIES" --concurrency 3 --repeats "$REPEATS" --variants "$VARIANTS"
          node scripts/profile/analyze.mjs "$OUT_DIR/matrix" | tee "$OUT_DIR/matrix.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-${{ matrix.name }}
          path: ${{ runner.temp }}/field-out
          if-no-files-found: ignore
          retention-days: 14
