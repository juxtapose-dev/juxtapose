name: release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance: the attestation is signed with a short-lived
  # OIDC token rather than a stored key, so the published package can be traced
  # back to this exact workflow run and commit.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs history to work out what changed since the last
          # release.
          fetch-depth: 0

      # Version comes from `packageManager`. Keep it on 10.x: pnpm 11 fails
      # OIDC publishing with a 404 on auth (pnpm/pnpm#11513).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10,
      # which never exchanges the OIDC token and PUTs anonymously (E404). The
      # first CI publish, 2026-10-13, failed exactly that way.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile

      # The publish script builds immediately before publishing. Version PRs
      # only update metadata, so building here duplicates release work.

      # Opens (or updates) a "Version Packages" PR when changesets are pending,
      # and publishes when that PR is merged — but only once publishing has
      # been deliberately switched on.
      #
      # The gate is a repository variable, PUBLISH_ENABLED, which does not
      # exist by default. Until it is set to 'true', this job versions and
      # opens the PR but never runs `changeset publish`. That matters because
      # the first publish of a package name is irreversible: a name can be
      # deprecated, never reclaimed. An accidental merge should not be able to
      # spend those names.
      #
      # To start publishing:
      #   gh variable set PUBLISH_ENABLED --body true --repo juxtapose-dev/juxtapose
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: ${{ vars.PUBLISH_ENABLED == 'true' && 'pnpm release' || '' }}
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN: auth is the OIDC token above. Each package
          # needs a trusted publisher on npmjs.com naming this workflow.
          # The registry rejects provenance from a private repo (E422
          # "Unsupported GitHub Actions source repository visibility",
          # 2026-10-13), so attest only once the repo is public.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
