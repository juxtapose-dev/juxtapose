name: release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance: the attestation is signed with a short-lived
  # OIDC token rather than a stored key, so the published package can be traced
  # back to this exact workflow run and commit.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs history to work out what changed since the last
          # release.
          fetch-depth: 0

      # Version comes from `packageManager` in package.json. Keep it on 10.x:
      # OIDC publishing works there, and pnpm 11 currently fails it with a 404
      # on auth (pnpm/pnpm#11513).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Opens (or updates) a "Version Packages" PR when changesets are pending,
      # and publishes when that PR is merged — but only once publishing has
      # been deliberately switched on.
      #
      # The gate is a repository variable, PUBLISH_ENABLED, which does not
      # exist by default. Until it is set to 'true', this job versions and
      # opens the PR but never runs `changeset publish`. That matters because
      # the first publish of a package name is irreversible: a name can be
      # deprecated, never reclaimed. An accidental merge should not be able to
      # spend those names.
      #
      # To start publishing:
      #   gh variable set PUBLISH_ENABLED --body true --repo juxtapose-dev/juxtapose
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: ${{ vars.PUBLISH_ENABLED == 'true' && 'pnpm release' || '' }}
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN. Publishing authenticates through npm Trusted
          # Publishing: pnpm exchanges the `id-token: write` OIDC token above
          # for a short-lived, single-purpose npm credential. Nothing long-lived
          # is stored, so there is no secret to leak or rotate.
          #
          # This also sidesteps the failure that blocked the first attempt: an
          # account with 2FA rejects a stored token from CI (`EOTP`), because
          # CI cannot produce a one-time password. OIDC needs no OTP.
          #
          # Requires each package to have a trusted publisher configured on
          # npmjs.com pointing at this repository and this workflow file.
          NPM_CONFIG_PROVENANCE: 'true'
